<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Brent Spence Bridge Proposed Noise</title>

    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
      integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"
      integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM="
      crossorigin=""
    ></script>

    <style>
      body {
        margin: 0;
        padding: 0;
      }

      body,
      table,
      tr,
      td,
      th,
      div,
      h1,
      h2,
      input {
        font-family: "Calibri", "Trebuchet MS", "Ubuntu", Serif;
        font-size: 11pt;
      }

      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }

      /* full size */
      .ctl {
        padding: 2px 10px 2px 10px;
        background: white;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        border-radius: 5px;
        text-align: right;
      }

      .title {
        font-size: 18pt;
        font-weight: bold;
      }

      .src {
        font-size: 10pt;
      }

      p {
        font-size: 16px;
        font-weight: bold;
        line-height: 1.5;
        color: #444;
        margin: 10px;
        text-align: center;
        padding-right: 15px;
        /* padding-left: 10px; */
      }

      /* Following rules overwrite the Leaflet default popup styles, regardless of browser orientation. */

      .leaflet-popup-content {
        width: auto;
        font-family: "Libre Franklin", sans-serif;
      }

      .leaflet-bar a {
        /* border: 2px solid rgba(244, 244, 244, 0.2); */
        background: rgba(100, 100, 100, 0.9);
        color: rgba(244, 244, 244, 0.8);
      }

      .leaflet-control-layers-expanded {
        background: rgba(243, 243, 243, 0.9);
        /* color: rgba(244, 244, 244, 0.8); */
        font-size: 14.4px;
        font-weight: bolder;
      }

      .leaflet-popup-content img {
        width: 100%;
      }

      .leaflet-popup-content u {
        font-weight: bold;
      }

      .leaflet-popup-content h2 {
        display: inline;
        font-size: 1.6em;
        font-weight: bold;
        margin: 0;
      }

      .leaflet-popup-content p {
        font-size: 1.2em;
        margin: 0;
      }

      #legend {
        position: static; /* Let it flow naturally inside the side-panel */
        margin: 15px auto;
        padding: 10px;
        background-color: rgba(255, 255, 255, 0.8);
        border: 1px solid #ccc;
        border-radius: 5px;
        width: 90%;
        max-width: 90%;
        box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.2);
      }

      .legend-text {
        text-shadow: 0px 0px 5px rgba(104, 104, 104, 0.3);
        font-weight: bold;
        font-size: 1em;
        -webkit-text-stroke: 1px rgba(116, 116, 116, 0.8);
        text-stroke: 1px rgba(116, 116, 116, 0.8);
        color: inherit;
        display: inline-block;
        padding: 2px 6px;
        border-radius: 6px;
        transition: background-color 0.2s ease, color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .legend-text:hover {
        text-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
        background-color: rgba(200, 200, 200);
        -webkit-text-stroke: 0.4px rgba(0, 0, 0, 0.4);
        text-stroke: 0.4px rgba(0, 0, 0, 0.4);
      }

      .legend-item {
        text-align: left;
        margin: 5px 0;
      }

      .leaflet-control-layers {
        position: relative;
        background: rgba(240, 240, 240, 0.9);
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        padding: 10px;
      }

      .leaflet-control-layers button {
        font-family: "Libre Franklin", sans-serif;
        font-weight: 400;
        color: #ffffff;
        background-color: #007bff;
        border: none;
        border-radius: 5px;
        padding: 10px 20px;
        cursor: pointer;
        margin: 10px auto;
        display: block;
        text-align: center;
      }

      .leaflet-control-layers button:hover {
        background-color: #0059b8;
      }

      /* Mobile-friendly layout */
      @media (max-width: 768px) {
        h1 {
          font-size: 1.2em;
        }

        .legend-text {
          font-size: 0.9em;
        }

        #container {
          flex-direction: column; /* Stack the elements vertically */
          height: auto;
          overflow-y: auto;
        }

        #side-panel {
          width: 100%; /* Full width */
          height: 25vh;
          order: 2; /* Place the panel at the bottom */
          border-right: none;
          border-top: 2px solid #ddd8c7;
          padding: 10px;
          align-items: flex-start;
        }

        #map {
          height: 75vh;
          order: 1; /* Place the map above the panel */
        }
      }

      .basemap-switcher {
        background: rgba(255, 255, 255, 0.9);
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        text-align: center;
      }

      .basemap-switcher h4 {
        margin: 0 0 8px 0;
        font-size: 1em;
        color: #333;
      }

      .basemap-thumbnails {
        display: flex;
        gap: 8px;
        justify-content: center;
      }

      .basemap-thumbnails img {
        width: 50px;
        height: 50px;
        object-fit: cover;
        border: 2px solid #ccc;
        border-radius: 5px;
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .basemap-thumbnails img:hover {
        transform: scale(1.1);
        border-color: #007bff;
        box-shadow: 0 0 8px #007bff;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <script>
      /* **** Leaflet **** */

      // Base layers
      //  .. OpenStreetMap
      var osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        minZoom: 12,
        maxZoom: 20,
      });

      //  .. CartoDB Positron
      var cartodb = L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
        {
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, &copy; <a href="https://carto.com/attribution">CartoDB</a>',
          minZoom: 12,
          maxZoom: 20,
        }
      );

      //  .. White background
      var imagery = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          attribution:
            "Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community",
        }
      );

      // Overlay layers (TMS)
      var lyr = L.tileLayer("images/tiles/{z}/{x}/{y}.png", {
        tms: 1,
        attribution: "PEC",
        minZoom: 12,
        maxZoom: 16,
      });

      // Map
      var map = L.map("map", {
        center: [39.06913766116762, -84.54201607372632],
        zoom: 16,
        minZoom: 12,
        maxZoom: 20,
        layers: [imagery, lyr],
      });

      var basemaps = {
        OpenStreetMap: osm,
        "Grayscale Topo Reference": cartodb,
        Imagery: imagery,
      };
      var overlaymaps = { Layer: lyr };

      // Title
      var title = L.control();
      title.onAdd = function (map) {
        this._div = L.DomUtil.create("div", "ctl title");
        this.update();
        return this._div;
      };
      title.update = function (props) {
        this._div.innerHTML = "Brent Spence Bridge - Noise";
      };
      title.addTo(map);

      // Note
      var src =
        'Generated by <a href="https://gdal.org/programs/gdal2tiles.html">GDAL2Tiles</a>, Copyright &copy; 2008 <a href="http://www.klokan.cz/">Klokan Petr Pridal</a>,  <a href="https://gdal.org">GDAL</a> &amp; <a href="https://www.osgeo.org/">OSGeo</a> <a href="https://summerofcode.withgoogle.com/">GSoC</a>';
      var title = L.control({ position: "bottomleft" });
      title.onAdd = function (map) {
        this._div = L.DomUtil.create("div", "ctl src");
        this.update();
        return this._div;
      };
      title.update = function (props) {
        this._div.innerHTML = src;
      };
      title.addTo(map);

      // Add base layers
      L.control.layers(basemaps, overlaymaps, { collapsed: false }).addTo(map);

      // Fit to overlay bounds (SW and NE points with (lat, lon))
      //   map.whenReady(() => {
      //     map.fitBounds(lyr.getBounds());
      //   });

      // fetch geojson data
      fetch("data/receivers.geojson")
        .then((response) => response.json())
        .then((geojson) => {
          // Filter features where Proposed or Barrier is null/empty
          const filteredFeatures = geojson.features.filter((f) => {
            const p = f.properties;
            return (
              p.Proposed && p.Barrier && !isNaN(p.Proposed) && !isNaN(p.Barrier)
            );
          });

          const filtered = { ...geojson, features: filteredFeatures };

          receiversLayer = L.geoJSON(filtered, {
            pointToLayer: function (feature, latlng) {
              return L.circleMarker(latlng, {
                radius: 6,
                weight: 1,
                color: "#000000",
                opacity: map.getZoom() > 16 ? 1 : 0,
                fillColor: getFillColor(feature.properties),
                fillOpacity: map.getZoom() > 16 ? 1 : 0,
              });
            },
            onEachFeature: function (feature, layer) {
              const props = feature.properties;

              const receiver = props.Receiver || "Not Available";
              const proposed = props.Proposed
                ? `${parseFloat(props.Proposed).toFixed(1)} dB[A]`
                : "Not Available";
              const barrier = props.Barrier
                ? `${parseFloat(props.Barrier).toFixed(1)} dB[A]`
                : "Not Available";
              const reduction = props.Reduction
                ? `${parseFloat(props.Reduction).toFixed(1)} dB[A]`
                : "Not Available";
              const popupContent = `
                <strong>Receiver:</strong> ${receiver}<br>
                <strong>Proposed Noise Levels without Barrier:</strong> ${proposed}<br>
                <strong>Proposed Noise Levels with Barrier:</strong> ${barrier}<br>
                <strong>Noise Reduction:</strong> ${reduction}
                `;
              layer.bindPopup(popupContent);
            },
          }).addTo(map);
          map.on("zoomend", () => {
            const zoom = map.getZoom();
            receiversLayer.eachLayer((layer) => {
              if (layer.setStyle) {
                layer.setStyle({
                  opacity: zoom > 16 ? 1 : 0,
                  fillOpacity: zoom > 16 ? 1 : 0,
                });
              }
            });
          });
          // fit map to receiversLayer extent
          map.fitBounds(receiversLayer.getBounds());

        });

   
      // function to get fill color based on feature properties
      function getFillColor(props) {
        const impacted = props.Impact?.toLowerCase() === "yes";
        const benefited = props.Benefited?.toLowerCase() === "yes";

        if (impacted && benefited) return "#4CE600";
        if (!impacted && benefited) return "#FFFF00";
        if (!impacted && !benefited) return "#FF7D18";
        if (impacted && !benefited) return "#FF0000";

        return "#AAAAAA";
      }
    </script>
  </body>
</html>
